<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VerseBox v8 - Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  .verse-glow { animation: glowPulse 2.2s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { text-shadow: 0 0 0px currentColor; } 50% { text-shadow: 0 0 22px currentColor; } }
  .embossed-texture { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E"); }
  * { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const themes = {
  dark:{key:"dark",label:"Original Dark",root_bg:"#000000",frame_bg:"#101318",display_bg:"#101318",text_fg:"#e9edf1",info_fg:"#6b7280",counter_fg:"#6b7280",highlight:"#2b3240",menu_bg:"#151a21",menu_fg:"#d1d5db",active_bg:"#232b38",auto_on:"#22c55e",auto_off:"#101318",glow:"#7dd3fc",font_family:"Inter, system-ui, sans-serif"},
  emerald:{key:"emerald",label:"Green Emerald",root_bg:"#000807",frame_bg:"#0b1f19",display_bg:"#0b1f19",text_fg:"#f5e9c9",info_fg:"#9ca3af",counter_fg:"#9ca3af",highlight:"#1e3d32",menu_bg:"#0f2420",menu_fg:"#e8f5e9",active_bg:"#1a3d35",auto_on:"#22c55e",auto_off:"#0b1f19",glow:"#7dd3fc",font_family:"Segoe UI Semilight"},
  marble:{key:"marble",label:"White Marble",root_bg:"#f0eeea",frame_bg:"#ffffff",display_bg:"#ffffff",text_fg:"#d4af37",info_fg:"#9ca3af",counter_fg:"#9ca3af",highlight:"#d6d3ce",menu_bg:"#faf9f7",menu_fg:"#5a4a2a",active_bg:"#f0e6c8",auto_on:"#22c55e",auto_off:"#e5e5e5",glow:"#d4af37",font_family:'"Cormorant Garamond", serif'},
  redwhite:{key:"redwhite",label:"Red on White",root_bg:"#f2efea",frame_bg:"#ffffff",display_bg:"#ffffff",text_fg:"#C1121F",info_fg:"#78716c",counter_fg:"#a8a29e",highlight:"#e7e5e4",menu_bg:"#ffffff",menu_fg:"#1c1917",active_bg:"#fef2f2",auto_on:"#C1121F",auto_off:"#ffffff",glow:"#fca5a5",font_family:'"Cormorant Garamond", serif'},
  goldgreen:{key:"goldgreen",label:"Golden on Green",root_bg:"#06130e",frame_bg:"#0B3D2E",display_bg:"#0B3D2E",text_fg:"#F5D76E",info_fg:"#7fb392",counter_fg:"#8ec3a0",highlight:"#1a4d3a",menu_bg:"#0e3a2b",menu_fg:"#f9e8a0",active_bg:"#154d3b",auto_on:"#D4AF37",auto_off:"#0B3D2E",glow:"#F5D76E",font_family:'"Cormorant Garamond", serif',gradient:"radial-gradient(120% 120% at 0% 0%, #123f33 0%, #0B3D2E 55%, #081f18 100%)"},
  embossed:{key:"embossed",label:"Embossed Black on Cream",root_bg:"#efe6cc",frame_bg:"#FDF6E3",display_bg:"#FDF6E3",text_fg:"#1a1a1a",info_fg:"#8c7f66",counter_fg:"#9a8c76",highlight:"#e9ddb8",menu_bg:"#fdf6e3",menu_fg:"#3d3525",active_bg:"#f0e5c0",auto_on:"#1a1a1a",auto_off:"#FDF6E3",glow:"#57534e",font_family:'"Cormorant Garamond", serif',texture:true},
  whiteblue:{key:"whiteblue",label:"White on Blue",root_bg:"#0f1a3d",frame_bg:"#1E3A8A",display_bg:"#1E3A8A",text_fg:"#FFFFFF",info_fg:"#93b1ff",counter_fg:"#a8c0ff",highlight:"#2a4ab8",menu_bg:"#1a368a",menu_fg:"#eef2ff",active_bg:"#2442a8",auto_on:"#FFFFFF",auto_off:"#1E3A8A",glow:"#ffffff",font_family:'"Inter", system-ui, sans-serif',gradient:"radial-gradient(140% 140% at 20% 10%, #2b4fcd 0%, #1E3A8A 48%, #152a75 100%)"},
  blackwhite:{key:"blackwhite",label:"Black on White",root_bg:"#f2f2f2",frame_bg:"#ffffff",display_bg:"#ffffff",text_fg:"#111111",info_fg:"#9ca3af",counter_fg:"#9ca3af",highlight:"#e5e7eb",menu_bg:"#ffffff",menu_fg:"#111111",active_bg:"#f5f5f5",auto_on:"#111111",auto_off:"#ffffff",glow:"#6b7280",font_family:'"Inter", system-ui, sans-serif'}
};
const themeKeys = Object.keys(themes);
const initialVerses = [
"The LORD is my shepherd; I shall not want. — Psalm 23:1",
"Be still, and know that I am God. — Psalm 46:10",
"For God so loved the world, that he gave his only Son. — John 3:16",
"I can do all things through him who strengthens me. — Philippians 4:13",
"The light shines in the darkness, and the darkness has not overcome it. — John 1:5",
"Trust in the LORD with all your heart. — Proverbs 3:5",
"Love is patient, love is kind. — 1 Corinthians 13:4",
"Your word is a lamp to my feet and a light to my path. — Psalm 119:105",
"Be strong and courageous. Do not be afraid. — Joshua 1:9",
"Peace I leave with you; my peace I give to you. — John 14:27",
"Two roads diverged in a wood, and I — I took the one less traveled by. — Frost",
"Hope is the thing with feathers that perches in the soul. — Dickinson",
"I have measured out my life with coffee spoons. — Eliot",
"What you seek is seeking you. — Rumi",
"In the middle of difficulty lies opportunity. — Einstein",
"The wound is the place where the Light enters you. — Rumi",
"We accept the love we think we deserve. — Chbosky",
"Not all those who wander are lost. — Tolkien",
"Everything you can imagine is real. — Picasso",
"Still, like dust, I'll rise. — Angelou"
];
const delays = [10,20,30,50];

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function VerseBox(){
  const [verses,setVerses] = useState(initialVerses);
  const [pos,setPos] = useState(0);
  const [label,setLabel] = useState("demo • 20 verses");
  const [themeKey,setThemeKey] = useState("dark");
  const [fontSize,setFontSize] = useState(28);
  const [shuffleOn,setShuffleOn] = useState(false);
  const [order,setOrder] = useState(()=> initialVerses.map((_,i)=>i));
  const [autoOn,setAutoOn] = useState(false);
  const [delay,setDelay] = useState(10);
  const [showDrop,setShowDrop] = useState(false);
  const [copied,setCopied] = useState(false);
  const [showPaste,setShowPaste] = useState(false);
  const [pasteText,setPasteText] = useState("");
  const [isFullscreen,setIsFullscreen] = useState(false);
  const [isSpeaking,setIsSpeaking] = useState(false);
  const [isPaused,setIsPaused] = useState(false);
  const [voices,setVoices] = useState([]);
  const [voiceName,setVoiceName] = useState("");
  const [speechRate,setSpeechRate] = useState(1);
  const [autoNarrate,setAutoNarrate] = useState(false);
  
  const intervalRef = useRef(null);
  const rootRef = useRef(null);
  const lastTapRef = useRef(0);
  const touchStartX = useRef(null);
  
  const p = themes[themeKey] || themes.dark;
  const actualIdx = order[pos] ?? 0;
  const currentVerse = verses[actualIdx] || "";

  useEffect(()=>{
    try{
      const h = localStorage.getItem("versebox-v8-themes");
      if(h){
        const S = JSON.parse(h);
        if(S.themeKey && themes[S.themeKey]) setThemeKey(S.themeKey);
        if(typeof S.fontSize==="number") setFontSize(Math.min(52,Math.max(16,S.fontSize)));
        if(typeof S.shuffle==="boolean") setShuffleOn(S.shuffle);
        if(typeof S.autoOn==="boolean") setAutoOn(S.autoOn);
        if(typeof S.delay==="number") setDelay(S.delay);
        if(typeof S.autoNarrate==="boolean") setAutoNarrate(S.autoNarrate);
        if(typeof S.speechRate==="number") setSpeechRate(S.speechRate);
        if(typeof S.voice==="string") setVoiceName(S.voice);
      }
    }catch{}
  },[]);
  useEffect(()=>{
    try{
      localStorage.setItem("versebox-v8-themes", JSON.stringify({themeKey, fontSize, shuffle:shuffleOn, autoOn, delay, autoNarrate, speechRate, voice:voiceName}));
    }catch{}
  },[themeKey,fontSize,shuffleOn,autoOn,delay,autoNarrate,speechRate,voiceName]);

  useEffect(()=>{
    const load = ()=>{
      const vs = window.speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("en"));
      setVoices(vs.length?vs:window.speechSynthesis.getVoices());
      if(!voiceName && vs.length){
        const best = vs.find(v=>/natural|neural|premium|enhanced/i.test(v.name)) || vs[0];
        setVoiceName(best.name);
      }
    };
    load();
    window.speechSynthesis.onvoiceschanged = load;
    return ()=>{ window.speechSynthesis.onvoiceschanged=null; };
  },[]);

  useEffect(()=>{
    const h = ()=> setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", h);
    return ()=> document.removeEventListener("fullscreenchange", h);
  },[]);

  useEffect(()=>{
    if(shuffleOn){
      const base = verses.map((_,i)=>i);
      const shuffled = shuffleArray(base);
      setOrder(shuffled);
      setPos(0);
    }else{
      setOrder(verses.map((_,i)=>i));
    }
  },[shuffleOn, verses.length]);

  const next = useCallback(()=>{
    setPos(h=>{
      if(verses.length<=1) return 0;
      if(shuffleOn){
        let nxt;
        do{ nxt = Math.floor(Math.random()*verses.length); } while(nxt===h && verses.length>1);
        return nxt;
      }else{
        return (h+1)%verses.length;
      }
    });
  },[verses.length, shuffleOn]);

  const prev = useCallback(()=>{
    setPos(h=>{
      if(verses.length<=1) return 0;
      if(shuffleOn){
        let nxt;
        do{ nxt = Math.floor(Math.random()*verses.length); } while(nxt===h && verses.length>1);
        return nxt;
      }else{
        return (h-1+verses.length)%verses.length;
      }
    });
  },[verses.length, shuffleOn]);

  const randomVerse = useCallback(()=>{
    if(verses.length<=1) return;
    let nxt;
    do{ nxt = Math.floor(Math.random()*verses.length); } while(nxt===pos && verses.length>1);
    setPos(nxt);
  },[verses.length, pos]);

  const handleShuffleClick = ()=>{
    if(shuffleOn){
      const shuffled = shuffleArray(verses.map((_,i)=>i));
      setOrder(shuffled);
      setPos(0);
    }else{
      setShuffleOn(true);
    }
  };

  useEffect(()=>{
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(autoOn){
      intervalRef.current = setInterval(()=>{ next(); }, delay*1000);
    }
    return ()=>{ if(intervalRef.current) clearInterval(intervalRef.current); };
  },[autoOn, delay, next]);

  const copy = async ()=>{
    try{ await navigator.clipboard.writeText(currentVerse); setCopied(true); setTimeout(()=>setCopied(false),1400); }
    catch{
      const ta=document.createElement("textarea"); ta.value=currentVerse; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); setCopied(true); setTimeout(()=>setCopied(false),1400);
    }
  };

  const loadVersesFromText = (text, src="pasted")=>{
    const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(lines.length){ 
      setVerses(lines); 
      setOrder(lines.map((_,i)=>i)); 
      setPos(0); 
      setLabel(src+" • "+lines.length+" verses"); 
      if(shuffleOn){ 
        setTimeout(()=>{ const sh = shuffleArray(lines.map((_,i)=>i)); setOrder(sh); setPos(0); },0);
      } 
    }
  };
  const handleFile = (file)=>{
    const reader = new FileReader();
    reader.onload = (e)=> loadVersesFromText(e.target.result, file.name);
    reader.readAsText(file);
  };

  useEffect(()=>{
    const h = (e)=>{
      if(e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); next(); }
      if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
      if(e.key.toLowerCase()==="s"){ shuffleOn ? handleShuffleClick() : setShuffleOn(true); }
      if(e.key.toLowerCase()==="c"){ copy(); }
      if(e.key.toLowerCase()==="r"){ randomVerse(); }
    };
    window.addEventListener("keydown", h);
    return ()=> window.removeEventListener("keydown", h);
  },[next,prev,randomVerse,shuffleOn]);

  const onTouchStart = (e)=>{ touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e)=>{
    if(touchStartX.current===null) return;
    const diff = e.changedTouches[0].clientX - touchStartX.current;
    if(Math.abs(diff)>50){ if(diff<0) next(); else prev(); }
    touchStartX.current=null;
  };
  const onVerseClick = ()=>{
    const now = Date.now();
    const diff = now - lastTapRef.current;
    if(diff<350 && diff>0){ copy(); lastTapRef.current=0; }
    else { next(); lastTapRef.current=now; }
  };

  const speak = useCallback((text)=>{
    if(!("speechSynthesis" in window)) return;
    try{ window.speechSynthesis.cancel(); }catch{}
    const ut = new SpeechSynthesisUtterance(text);
    const v = voices.find(v=>v.name===voiceName) || voices[0];
    if(v) ut.voice=v;
    ut.rate = Math.min(1.2, Math.max(0.8, speechRate));
    ut.onstart = ()=>{ setIsSpeaking(true); setIsPaused(false); };
    ut.onend = ()=>{ setIsSpeaking(false); setIsPaused(false); };
    ut.onerror = ()=>{ setIsSpeaking(false); setIsPaused(false); };
    try{ window.speechSynthesis.speak(ut); }catch{}
  },[voices, voiceName, speechRate]);

  useEffect(()=>{ if(autoNarrate && currentVerse) { const t=setTimeout(()=>speak(currentVerse),120); return ()=>clearTimeout(t); } },[actualIdx, autoNarrate]);

  const toggleSpeak = ()=>{
    if(isSpeaking && !isPaused){ try{ window.speechSynthesis.pause(); setIsPaused(true);}catch{} }
    else if(isSpeaking && isPaused){ try{ window.speechSynthesis.resume(); setIsPaused(false);}catch{} }
    else { speak(currentVerse); }
  };
  const stopSpeak = ()=>{ try{ window.speechSynthesis.cancel(); }catch{} setIsSpeaking(false); setIsPaused(false); };

  const frameStyle = { background: p.gradient || p.frame_bg, borderColor:p.highlight, boxShadow:"0 12px 40px rgba(0,0,0,"+(p.key.includes("white")||p.key==="marble"||p.key==="redwhite"||p.key==="embossed"?0.12:0.55)+"), 0 0 0 1px "+p.highlight+" inset" };

  return (
    <div className="min-h-[100dvh] w-full flex flex-col items-center justify-start pt-[18px] sm:pt-[42px] pb-[28px] px-0 transition-colors duration-500" style={{background:p.root_bg, fontFamily:"Inter, system-ui, sans-serif"}} onDragOver={(e)=>{e.preventDefault(); setShowDrop(true);}} onDragLeave={()=>setShowDrop(false)} onDrop={(e)=>{e.preventDefault(); setShowDrop(false); const f=e.dataTransfer.files?.[0]; if(f) handleFile(f); const txt=e.dataTransfer.getData("text"); if(!f && txt) loadVersesFromText(txt,"dropped");}}>
      {showDrop && <div className="fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm flex items-center justify-center pointer-events-none"><div className="bg-white rounded-[18px] px-7 py-5 shadow-2xl text-[15px] font-medium">Drop .txt to load verses</div></div>}
      <div ref={rootRef} className="relative w-[calc(100%-18px)] max-w-[620px] rounded-[22px] border overflow-hidden transition-all duration-500" style={frameStyle}>
        <div className="flex items-center justify-between gap-2 px-[18px] sm:px-[22px] h-[48px] border-b" style={{borderColor:p.highlight, background:p.display_bg}}>
          <div className="flex items-center gap-2 min-w-0 flex-wrap">
            <span className="text-[11px] tracking-[0.12em] uppercase truncate font-medium" style={{color:p.info_fg}}>{label}</span>
            {shuffleOn && <span className="inline-flex items-center rounded-full px-2 h-[18px] text-[10px] font-bold tracking-widest" style={{background:p.active_bg, color:p.text_fg, border:"1px solid "+p.highlight}}>SHUF</span>}
            {autoOn && (
              <span className="inline-flex items-center gap-1.5 rounded-full px-2.5 h-[20px] text-[10px] font-bold tracking-widest border" style={{background:"#0a0a0a", color:"#fff", borderColor:"#222", boxShadow:"0 0 0 1px #ffffff0a inset"}}>
                <span className="h-[7px] w-[7px] rounded-full bg-[#22c55e] animate-pulse" style={{boxShadow:"0 0 8px #22c55e"}}></span>
                AUTO {delay}S
              </span>
            )}
            <span className="text-[12px] font-medium tabular-nums" style={{color:p.counter_fg}}>{pos+1}/{verses.length}</span>
          </div>
          <div className="flex items-center gap-[7px] shrink-0">
            <div className="flex items-center gap-1">
              <button onClick={()=>setFontSize(v=>Math.max(16,v-2))} className="h-[28px] w-[28px] rounded-full border grid place-items-center text-[12px]" style={{borderColor:p.highlight, color:p.info_fg}}>A-</button>
              <button onClick={()=>setFontSize(v=>Math.min(52,v+2))} className="h-[28px] w-[28px] rounded-full border grid place-items-center text-[12px]" style={{borderColor:p.highlight, color:p.info_fg}}>A+</button>
            </div>
            <button onClick={()=>{ const el=document.getElementById('theme-panel'); if(el) el.classList.toggle('hidden'); }} className="h-[28px] w-[28px] rounded-full border grid place-items-center" style={{borderColor:p.highlight, color:p.info_fg}}>🎨</button>
          </div>
        </div>

        <div id="theme-panel" className="hidden px-3 py-2 border-b grid grid-cols-2 gap-2" style={{borderColor:p.highlight, background:p.display_bg}}>
          {themeKeys.map(k=>{
            const t = themes[k];
            return <button key={k} onClick={()=>setThemeKey(k)} className={"text-left px-3 py-2 rounded-[10px] border text-[12px] "+(themeKey===k?"font-bold":"")} style={{background: themeKey===k? t.active_bg : t.frame_bg, color:t.text_fg, borderColor:t.highlight, fontFamily:t.font_family}}>{t.label}</button>
          })}
        </div>

        <div className="relative px-[22px] sm:px-[32px] py-[28px] sm:py-[38px] min-h-[220px] flex items-center justify-center" style={{background:p.display_bg}} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          {p.texture && <div className="absolute inset-0 embossed-texture pointer-events-none opacity-60"></div>}
          <div onClick={onVerseClick} className={"relative w-full text-center leading-[1.35] select-text cursor-pointer transition-all duration-300 "+(isSpeaking?"verse-glow":"")} style={{fontFamily:p.font_family, color:p.text_fg, fontSize:fontSize+"px", fontWeight:600}}>{currentVerse}</div>
          {isSpeaking && <div className="pointer-events-none absolute inset-0 border-2 opacity-40 animate-pulse" style={{borderColor:p.glow, boxShadow:"0 0 32px "+p.glow+"66 inset"}}></div>}
        </div>

        <div className="flex flex-col gap-2 px-3 sm:px-4 py-3 border-y" style={{background:p.frame_bg, borderColor:p.highlight}}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <div className="h-7 w-7 rounded-full grid place-items-center border" style={{borderColor:p.highlight, background:isSpeaking?p.active_bg:"transparent", color:isSpeaking?p.glow:p.info_fg}}>🔊</div>
              <span className="text-[11px] tracking-[0.14em] uppercase font-semibold" style={{color:p.info_fg}}>Narration</span>
              {isSpeaking && <span className="h-1.5 w-1.5 rounded-full bg-green-500 animate-pulse"></span>}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] tracking-widest uppercase" style={{color:p.info_fg}}>Auto</span>
              <button onClick={()=>setAutoNarrate(v=>!v)} className="relative h-[22px] w-[40px] rounded-full border transition" style={{background:autoNarrate?p.auto_on:p.auto_off, borderColor:p.highlight}}><span className="absolute top-[2px] h-[16px] w-[16px] rounded-full bg-white shadow transition-all" style={{left:autoNarrate?"20px":"2px"}}></span></button>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <button onClick={toggleSpeak} className="h-[36px] px-4 rounded-full border inline-flex items-center gap-2 text-[13px] font-semibold" style={{background:isSpeaking?p.active_bg:p.display_bg, color:p.text_fg, borderColor:isSpeaking?p.glow:p.highlight}}>{isSpeaking && !isPaused ? "⏸ Pause" : isPaused ? "▶ Resume" : "▶ Narrate"}</button>
            <button onClick={stopSpeak} className="h-[36px] w-[36px] rounded-full border grid place-items-center" style={{background:p.display_bg, color:p.info_fg, borderColor:p.highlight}}>⏹</button>
            <div className="flex items-center gap-2 ml-1">
              <span className="text-[11px]" style={{color:p.info_fg}}>Rate</span>
              <input type="range" min="0.8" max="1.2" step="0.05" value={speechRate} onChange={e=>setSpeechRate(parseFloat(e.target.value))} className="w-[86px] accent-current" />
              <span className="text-[11px] tabular-nums w-[26px]" style={{color:p.counter_fg}}>{speechRate.toFixed(2)}</span>
            </div>
            <select value={voiceName} onChange={e=>setVoiceName(e.target.value)} className="ml-auto h-[32px] max-w-[160px] rounded-full border px-3 text-[12px] bg-transparent outline-none" style={{borderColor:p.highlight, color:p.menu_fg, background:p.display_bg}}>
              {voices.map(v=> <option key={v.name} value={v.name} style={{background:p.menu_bg, color:p.menu_fg}}>{v.name} • {v.lang}</option>)}
            </select>
          </div>
        </div>

        <div className="px-3 sm:px-4 py-3 flex flex-col gap-3" style={{background:p.frame_bg}}>
          <div className="flex items-center justify-between gap-2">
            <div className="flex items-center gap-2">
              <button onClick={prev} className="h-[38px] w-[38px] rounded-full border grid place-items-center transition active:scale-[0.97]" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>◀</button>
              <button onClick={next} className="h-[38px] w-[38px] rounded-full border grid place-items-center transition active:scale-[0.97]" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>▶</button>
              <button onClick={copy} className="h-[38px] px-3 rounded-full border inline-flex items-center gap-1.5 text-[12px] font-medium" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>{copied?"Copied!":"Copy"}</button>
            </div>
            <div className="flex items-center gap-2">
              <div className="flex items-center gap-1">
                <button onClick={handleShuffleClick} title={shuffleOn ? "Click to reshuffle • Right-click to turn off" : "Shuffle"} className="h-[38px] px-3 rounded-full border inline-flex items-center gap-1.5 text-[12px] font-medium transition" style={{background:shuffleOn?p.active_bg:p.display_bg, color:shuffleOn?p.text_fg:p.info_fg, borderColor:shuffleOn?p.glow:p.highlight, boxShadow:shuffleOn?"0 0 0 1px "+p.glow+"55 inset":undefined}}>🔀 Shuffle</button>
                {shuffleOn && <button onClick={()=>setShuffleOn(false)} className="h-[24px] px-2 rounded-full text-[10px] border" style={{borderColor:p.highlight, color:p.info_fg}}>OFF</button>}
              </div>
              <button onClick={randomVerse} className="h-[38px] px-3 rounded-full border inline-flex items-center gap-1.5 text-[12px] font-medium" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>✨ Random</button>
            </div>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <div className="flex items-center gap-2 rounded-full border px-2 h-[38px]" style={{borderColor:p.highlight, background:p.display_bg}}>
              <button onClick={()=>setAutoOn(v=>!v)} className="h-[26px] w-[40px] rounded-full border relative transition" style={{background:autoOn?p.auto_on:p.auto_off, borderColor:p.highlight}}><span className="absolute top-[2px] h-[18px] w-[18px] rounded-full shadow transition-all bg-white" style={{left:autoOn?"18px":"2px"}}></span></button>
              <span className="text-[11px] tracking-widest uppercase font-medium" style={{color:p.info_fg}}>ADVANCE</span>
              <div className="flex gap-1">
                {delays.map(d=> <button key={d} onClick={()=>setDelay(d)} className="h-[24px] min-w-[28px] px-1.5 rounded-full text-[11px] font-semibold border transition" style={{background:delay===d?p.active_bg:"transparent", color:delay===d?p.text_fg:p.info_fg, borderColor:delay===d?p.highlight:"transparent"}}>{d}s</button>)}
              </div>
              {autoOn && (
                <span className="ml-1 inline-flex items-center gap-1.5 rounded-full px-2.5 h-[20px] text-[10px] font-bold tracking-widest" style={{background:"#0a0a0a", color:"#fff"}}>
                  <span className="h-[6px] w-[6px] rounded-full bg-[#22c55e] animate-pulse" style={{boxShadow:"0 0 6px #22c55e"}}></span>
                  AUTO {delay}S
                </span>
              )}
            </div>

            <label className="h-[38px] px-3 rounded-full border inline-flex items-center gap-1.5 text-[12px] font-medium cursor-pointer" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>
              📁 Load .txt
              <input type="file" accept=".txt,text/plain" className="hidden" onChange={e=>{ const f=e.target.files?.[0]; if(f) handleFile(f); }} />
            </label>
            <button onClick={()=>setShowPaste(v=>!v)} className="h-[38px] px-3 rounded-full border inline-flex items-center gap-1.5 text-[12px] font-medium" style={{borderColor:p.highlight, color:p.text_fg, background:p.display_bg}}>📋 Paste</button>
            <button onClick={()=>{ if(!document.fullscreenElement) rootRef.current?.requestFullscreen?.(); else document.exitFullscreen?.(); }} className="h-[38px] w-[38px] rounded-full border grid place-items-center ml-auto" style={{borderColor:p.highlight, color:p.info_fg, background:p.display_bg}}>{isFullscreen?"🗗":"⛶"}</button>
          </div>

          {showPaste && (
            <div className="rounded-[14px] border p-2 flex flex-col gap-2" style={{borderColor:p.highlight, background:p.display_bg}}>
              <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder="Paste verses — one per line..." className="w-full min-h-[88px] rounded-[10px] border px-3 py-2 text-[13px] outline-none resize-y" style={{borderColor:p.highlight, background:p.frame_bg, color:p.text_fg}}></textarea>
              <div className="flex gap-2 justify-end">
                <button onClick={()=>setShowPaste(false)} className="h-8 px-3 rounded-full border text-[12px]" style={{borderColor:p.highlight, color:p.info_fg}}>Close</button>
                <button onClick={()=>{ loadVersesFromText(pasteText,"pasted"); setPasteText(""); setShowPaste(false); }} className="h-8 px-4 rounded-full text-[12px] font-semibold border" style={{background:p.text_fg, color:p.frame_bg, borderColor:p.text_fg}}>Load</button>
              </div>
            </div>
          )}

          <div className="flex flex-wrap gap-x-3 gap-y-1 text-[10px] tracking-wide uppercase" style={{color:p.info_fg}}>
            <span>← → Navigate</span><span>Tap: Next • Double: Copy</span><span>S: Shuffle • C: Copy • R: Random</span>
            {shuffleOn && <span className="text-green-500 font-bold">• Shuffle ON (click Shuffle to reshuffle)</span>}
            {autoOn && <span className="inline-flex items-center gap-1"><span className="h-1.5 w-1.5 rounded-full bg-green-500 animate-pulse"></span> AUTO {delay}s advancing</span>}
          </div>
        </div>
      </div>

      <div className="mt-5 flex items-center gap-2 text-[11px] tracking-[0.16em] uppercase" style={{color:p.info_fg, opacity:0.9}}>
        <span className="h-px w-6" style={{background:p.highlight}}></span>VerseBox v8 — Narrated • {p.label}<span className="h-px w-6" style={{background:p.highlight}}></span>
      </div>
      <div className="mt-3 text-[11px] max-w-[620px] text-center px-4 leading-relaxed" style={{color:p.info_fg}}>Drag & drop a .txt file, paste lines, or use demo verses. Shuffle now reshuffles on click. Random picks a truly random verse. AUTO shows green indicator with speed.</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VerseBox />);
</script>
</body>
</html>
